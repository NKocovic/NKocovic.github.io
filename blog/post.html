  <script>
    // the theme picked with the light/dark switch, if any, before the first paint
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
    document.documentElement.classList.add('js');
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.remove('js'); }, 2500);
    // Arriving from another page of the site: skip the header's load animation, the page fade covers it.
    addEventListener('pagereveal', function (e) {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(function () {}); // a skipped transition (e.g. a quick second click) is fine
      document.documentElement.classList.add('no-intro');
    });
    addEventListener('pageswap', function (e) {
      if (e.viewTransition) e.viewTransition.ready.catch(function () {});
    });
  </script>
  <script src="../site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
