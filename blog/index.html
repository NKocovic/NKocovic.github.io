<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Nikola Kočović's blog: physics, music, food and everything else, plus tier lists.">
  <meta name="blog-base" content="./">
  <link rel="canonical" href="https://nkocovic.github.io/blog/">
  <link rel="alternate" hreflang="en" href="https://nkocovic.github.io/blog/">
  <link rel="alternate" hreflang="sr-Latn" href="https://nkocovic.github.io/sr/blog/">
  <!-- link preview shown when the page is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nikola Kočović">
  <meta property="og:url" content="https://nkocovic.github.io/blog/">

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css?v=20261112d">
  <script>
    // the theme picked with the light/dark switch, if any, before the first paint
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
    document.documentElement.classList.add('js');
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.remove('js'); }, 2500);
    // Arriving from another page of the site: skip the header's load animation, the page fade covers it.
    addEventListener('pagereveal', function (e) {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(function () {}); // a skipped transition (e.g. a quick second click) is fine
      document.documentElement.classList.add('no-intro');
    });
    addEventListener('pageswap', function (e) {
      if (e.viewTransition) e.viewTransition.ready.catch(function () {});
    });
  </script>
  <script src="../site.js?v=20261112d" defer></script>
  <script src="blog.js?v=20261112d" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <nav class="top-nav" aria-label="Site">
        <a class="nav-blog" href="./" aria-current="page">Blog</a>
        <span class="lang">
          <span aria-current="true">EN</span>
          <a href="../sr/blog/" hreflang="sr-Latn" lang="sr-Latn">SR</a>
        </span>
      </nav>
      <a class="home-link" href="../">Nikola Kočović</a>
      <h1>Blog</h1>
      <p class="lede">Writing about physics, music, food and whatever else is on my mind, plus a few ranked lists of where to eat in Belgrade.</p>
    </header>

    <section id="posts">
      <h2>Posts</h2>
      <div>
        <ul class="entries" id="post-list"></ul>
        <p class="empty" id="post-empty" hidden></p>
      </div>
    </section>

    <!-- Tier lists: one section per list, built by blog.js from tierlists.json (see README.md) -->
    <div id="tierlists"></div>

    <footer class="footer">
      <span>&copy; 2026 Nikola Kočović</span>
    </footer>
  </main>
</body>
</html>
