<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — Nikola Kočović</title>
  <meta name="description" content="Nikola Kočović's blog: physics, music, food and everything else, plus tier lists.">
  <meta name="blog-base" content="./">
  <link rel="alternate" hreflang="sr-Latn" href="../sr/blog/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script>
    document.documentElement.classList.add('js');
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.remove('js'); }, 2500);
    // Page transitions: slide forward into the blog, back out of it, cross-fade between languages.
    addEventListener('pagereveal', function (e) {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(function () {}); // a skipped transition (e.g. a quick second click) is fine
      document.documentElement.classList.add('no-intro');
      try {
        var depth = function (u) { var p = new URL(u).pathname; return /\/blog\/post\.html$/.test(p) ? 2 : /\/blog\//.test(p) ? 1 : 0; };
        var from = navigation.activation.from;
        if (from) {
          var d = depth(location.href) - depth(from.url);
          e.viewTransition.types.add(d > 0 ? 'forward' : d < 0 ? 'back' : 'swap');
        }
      } catch (err) {}
    });
    addEventListener('pageswap', function (e) {
      if (e.viewTransition) e.viewTransition.ready.catch(function () {});
    });
  </script>
  <script src="../site.js" defer></script>
  <script src="blog.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <nav class="top-nav" aria-label="Site">
        <a class="nav-blog" href="./" aria-current="page">Blog</a>
        <span class="lang">
          <span aria-current="true">EN</span>
          <a href="../sr/blog/" hreflang="sr-Latn" lang="sr-Latn">SR</a>
        </span>
      </nav>
      <a class="home-link" href="../">Nikola Kočović</a>
      <h1 class="vt-blog">Blog</h1>
      <p class="lede">Writing about everything: physics, music, food, and whatever else is on my mind. Plus a few tier lists.</p>
      <p class="jump-links"><a href="#posts">Posts</a><a href="#tierlists">Tier lists</a></p>
    </header>

    <section id="posts">
      <h2>Posts</h2>
      <div>
        <ul class="entries" id="post-list"></ul>
        <p class="empty" id="post-empty" hidden></p>
      </div>
    </section>

    <!-- Tier lists: all the data is in tierlists.json (see README.md) -->
    <section id="tierlists">
      <h2>Tier lists</h2>
      <div class="tierlists" id="tierlists-box"></div>
    </section>

    <footer class="footer">
      <span>&copy; 2026 Nikola Kočović</span>
    </footer>
  </main>
</body>
</html>
