<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Now</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Now">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <!-- Private page: shows what's on the calendar right now. The schedule is encrypted
       (see scripts/now_build.py) and decrypted here with a password kept on this device. -->
  <style>
    @font-face { font-family: "Inter"; font-weight: 400 500; font-display: swap; src: url("../fonts/inter-latin.woff2") format("woff2"); }
    @font-face { font-family: "Newsreader"; font-weight: 400 500; font-display: swap; src: url("../fonts/newsreader-latin.woff2") format("woff2"); }
    :root { --bg: #fbfaf7; --text: #1b1b19; --muted: #66655f; --rule: #e4e2dc; --accent: #2648b8;
            --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131312; --text: #ebeae5; --muted: #9b9a94; --rule: #2b2b28; --accent: #93a9ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font-family: var(--serif); -webkit-font-smoothing: antialiased; padding: 24px 16px; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .label { font: 500 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: clamp(36px, 11vw, 52px); font-weight: 500; line-height: 1.1; margin: 14px 0 10px; overflow-wrap: anywhere; }
    .left { font: 500 22px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
    .bar { height: 6px; border-radius: 3px; background: var(--rule); margin: 18px 0 10px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .muted { color: var(--muted); font-family: var(--sans); font-size: 15px; }
    .next { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); }
    .next h2 { font-size: 24px; font-weight: 500; margin: 10px 0 4px; }
    form { display: grid; gap: 12px; }
    input, button { font: 17px var(--sans); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule);
                    background: transparent; color: var(--text); }
    button { background: var(--text); color: var(--bg); border: 0; }
    .err { color: #c0392b; min-height: 1.2em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <form id="lock" hidden>
    <div class="label">Password</div>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button>Open</button>
    <div class="muted err" id="err"></div>
  </form>
  <section id="view" hidden>
    <div class="label">Now</div>
    <h1 id="nowTitle"></h1>
    <div id="nowDetail">
      <div class="left" id="nowLeft"></div>
      <div class="bar"><i id="nowBar"></i></div>
      <div class="muted" id="nowUntil"></div>
    </div>
    <div class="next" id="next">
      <div class="label">Next</div>
      <h2 id="nextTitle"></h2>
      <div class="muted" id="nextWhen"></div>
    </div>
    <p class="muted" id="stale" hidden></p>
  </section>
</main>
<script>
const DATA = 'https://raw.githubusercontent.com/NKocovic/NKocovic.github.io/now-data/schedule.json';
const KEY = 'now-password';
const $ = id => document.getElementById(id);
let data = null;

const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(file, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(file.salt), iterations: file.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(file.iv) }, key, b64(file.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(password) {
  const res = await fetch(DATA + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch');
  return decrypt(await res.json(), password);
}

const time = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function left(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
}
function day(ms) {
  const d = new Date(ms), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - t) / 864e5);
  return diff === 0 ? '' : diff === 1 ? 'Tomorrow ' : d.toLocaleDateString([], { weekday: 'short' }) + ' ';
}

function render() {
  if (!data) return;
  const now = Date.now(), ev = data.events;
  // overlapping events: show the one that started most recently
  const cur = ev.filter(e => e.s <= now && e.e > now).sort((a, b) => b.s - a.s)[0];
  const nxt = ev.find(e => e.s > now);
  $('nowTitle').textContent = cur ? cur.t : 'Free time';
  $('nowDetail').hidden = !cur;
  if (cur) {
    $('nowLeft').textContent = left(cur.e - now) + ' left';
    $('nowBar').style.width = (100 * (now - cur.s) / (cur.e - cur.s)).toFixed(2) + '%';
    $('nowUntil').textContent = 'until ' + time(cur.e);
  }
  $('next').hidden = !nxt;
  if (nxt) {
    $('nextTitle').textContent = nxt.t;
    $('nextWhen').textContent = `${day(nxt.s)}${time(nxt.s)} · in ${left(nxt.s - now)}`;
  }
  const age = now - data.built;
  $('stale').hidden = age < 3 * 3600e3;
  $('stale').textContent = `Calendar last synced ${Math.round(age / 3600e3)}h ago.`;
  document.title = cur ? cur.t : 'Now';
}

async function refresh(password) {
  try { data = await load(password); render(); } catch {}
}

async function start(password) {
  data = await load(password);
  store.set(password);
  $('lock').hidden = true; $('view').hidden = false;
  render();
  setInterval(render, 1000);
  setInterval(() => refresh(password), 5 * 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(password); });
}

function showLock(msg) { $('lock').hidden = false; $('err').textContent = msg || ''; $('pw').focus(); }

$('lock').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = 'Opening…';
  try { await start($('pw').value); }
  catch (err) { showLock(err.message === 'fetch' ? 'Could not load the schedule.' : 'Wrong password.'); }
});

const saved = store.get();
if (saved) start(saved).catch(err => showLock(err.message === 'fetch' ? 'Could not load the schedule.' : ''));
else showLock();
</script>
</body>
</html>
