<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Now</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Now">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <!-- Private page: shows what's on the calendar right now. The schedule is encrypted
       (see scripts/now_build.py) and decrypted here with a password kept on this device. -->
  <link rel="stylesheet" href="../style.css?v=20261122b">
  <script>
    // the theme picked with the light/dark switch on the main site, if any
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
  </script>
  <style>
    /* only what style.css doesn't already cover */
    .now-title { margin: 0 0 12px; }
    .now-left { font-family: var(--sans); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; margin: 0; }
    .now-bar { height: 3px; background: var(--rule); margin: 20px 0 10px; max-width: 32em; }
    .now-bar i { display: block; height: 100%; background: var(--accent); }
    .now-next-title { font-size: 1.375rem; font-weight: 500; margin: 0 0 2px; line-height: 1.3; }
    .now-lock { display: flex; gap: 12px; flex-wrap: wrap; max-width: 32em; }
    .now-lock input { flex: 1 1 200px; font: inherit; font-family: var(--sans); font-size: 1rem; padding: 10px 0;
                      border: 0; border-bottom: 1px solid var(--underline); background: transparent; color: var(--text); border-radius: 0; }
    .now-lock input:focus { outline: none; border-bottom-color: var(--accent); }
    .now-lock button { font: inherit; font-size: 1rem; background: none; border: 0; padding: 10px 0; color: var(--text); cursor: pointer;
                       text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 3px; }
    .now-goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .now-goals li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .now-goals .t { font-size: 1.125rem; line-height: 1.35; }
    .now-goals .when { display: block; color: var(--muted); font-size: 1rem; }
    .now-goals .soon .when { color: var(--accent); }
    .now-goals button { font: inherit; font-size: .9375rem; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer;
                        text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 3px; flex: none; }
    .now-add { margin-top: 20px; }
    .now-add input[type=date] { flex: 0 1 150px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <a class="home-link" href="../">Nikola Kočović</a>
      <div id="lockWrap" hidden>
        <h1>Now</h1>
        <form class="now-lock" id="lock">
          <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
          <button>Open</button>
        </form>
        <p class="lede" id="err" style="margin-top:12px"></p>
      </div>
      <div id="view" hidden>
        <h1 class="now-title" id="nowTitle"></h1>
        <div id="nowDetail">
          <p class="now-left" id="nowLeft"></p>
          <div class="now-bar"><i id="nowBar"></i></div>
          <p class="lede" id="nowUntil"></p>
        </div>
      </div>
    </header>
    <section id="next" hidden>
      <h2>Next</h2>
      <div>
        <p class="now-next-title" id="nextTitle"></p>
        <p class="lede" id="nextWhen" style="margin:0"></p>
      </div>
    </section>
    <section id="goals" hidden>
      <h2>Goals</h2>
      <div>
        <ul class="now-goals" id="goalList"></ul>
        <form class="now-lock now-add" id="addGoal" hidden>
          <input id="goalText" placeholder="New goal" aria-label="New goal" required>
          <input id="goalDate" type="date" aria-label="Due date">
          <button>Add</button>
        </form>
        <p class="lede" id="goalErr" style="margin:8px 0 0"></p>
      </div>
    </section>
    <p class="lede" id="stale" hidden></p>
  </main>
<script>
const DATA = 'https://raw.githubusercontent.com/NKocovic/NKocovic.github.io/now-data/schedule.json';
const KEY = 'now-password';
const $ = id => document.getElementById(id);
let data = null;

const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(file, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(file.salt), iterations: file.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(file.iv) }, key, b64(file.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function encrypt(obj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  const enc = b => btoa(String.fromCharCode(...b));
  return { iter, salt: enc(salt), iv: enc(iv), ct: enc(ct) };
}

async function load(password) {
  const res = await fetch(DATA + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch');
  return decrypt(await res.json(), password);
}

const time = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function left(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
}
function day(ms) {
  const d = new Date(ms), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - t) / 864e5);
  return diff === 0 ? '' : diff === 1 ? 'Tomorrow ' : d.toLocaleDateString([], { weekday: 'short' }) + ' ';
}

function render() {
  if (!data) return;
  const now = Date.now(), ev = data.events;
  // overlapping events: show the one that started most recently
  const cur = ev.filter(e => e.s <= now && e.e > now).sort((a, b) => b.s - a.s)[0];
  const nxt = ev.find(e => e.s > now);
  $('nowTitle').textContent = cur ? cur.t : 'Free time';
  $('nowDetail').hidden = !cur;
  if (cur) {
    $('nowLeft').textContent = left(cur.e - now) + ' left';
    $('nowBar').style.width = (100 * (now - cur.s) / (cur.e - cur.s)).toFixed(2) + '%';
    $('nowUntil').textContent = 'until ' + time(cur.e);
  }
  $('next').hidden = !nxt;
  if (nxt) {
    $('nextTitle').textContent = nxt.t;
    $('nextWhen').textContent = `${day(nxt.s)}${time(nxt.s)} · in ${left(nxt.s - now)}`;
  }
  const age = now - data.built;
  $('stale').hidden = age < 3 * 3600e3;
  $('stale').textContent = `Calendar last synced ${Math.round(age / 3600e3)}h ago.`;
  document.title = cur ? cur.t : 'Now';
}

async function refresh(password) {
  try { data = await load(password); render(); loadGoals(password); } catch {}
}

async function start(password) {
  data = await load(password);
  store.set(password);
  $('lockWrap').hidden = true; $('view').hidden = false;
  render();
  loadGoals(password);
  setInterval(render, 1000);
  setInterval(() => refresh(password), 5 * 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(password); });
}

// ---------- Goals: encrypted goals.json on the now-goals branch ----------
const GOALS = 'https://api.github.com/repos/NKocovic/NKocovic.github.io/contents/goals.json?ref=now-goals';
let goals = [], goalsSha = null;
const ghHeaders = () => Object.assign({ Accept: 'application/vnd.github+json' }, data.token ? { Authorization: 'Bearer ' + data.token } : {});
const fromB64Utf8 = s => new TextDecoder().decode(b64(s.replace(/\s/g, '')));
const toB64Utf8 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

async function loadGoals(password) {
  try {
    const res = await fetch(GOALS + '&t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
    if (!res.ok) return;
    const file = await res.json();
    goalsSha = file.sha;
    goals = (await decrypt(JSON.parse(fromB64Utf8(file.content)), password)).goals || [];
    renderGoals();
  } catch {}
}

async function saveGoals(password, next) {
  const body = { message: 'Update goals', branch: 'now-goals', ...(goalsSha ? { sha: goalsSha } : {}),
                 content: toB64Utf8(JSON.stringify(await encrypt({ goals: next }, password))) };
  const res = await fetch(GOALS.split('?')[0], { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
  if (!res.ok) throw new Error('save');
  goalsSha = (await res.json()).content.sha;
  goals = next;
  renderGoals();
}

function dueText(d) {
  const due = new Date(d + 'T00:00'), today = new Date(); today.setHours(0, 0, 0, 0);
  const n = Math.round((due - today) / 864e5);
  const date = due.toLocaleDateString([], { day: 'numeric', month: 'short' });
  return [n, `${date} · ` + (n > 1 ? `${n} days left` : n === 1 ? 'tomorrow' : n === 0 ? 'today' : `${-n} days ago`)];
}

function renderGoals() {
  const list = $('goalList'), canEdit = !!data.token;
  list.replaceChildren();
  const sorted = goals.map((g, i) => ({ ...g, i })).sort((a, b) => (a.d || '9999').localeCompare(b.d || '9999'));
  for (const g of sorted) {
    const li = document.createElement('li'), left = document.createElement('div'), t = document.createElement('span');
    t.className = 't'; t.textContent = g.t; left.append(t);
    if (g.d) {
      const [n, text] = dueText(g.d), w = document.createElement('span');
      w.className = 'when'; w.textContent = text; left.append(w);
      if (n <= 7) li.className = 'soon';
    }
    li.append(left);
    if (canEdit) {
      const b = document.createElement('button');
      b.textContent = 'Done';
      b.onclick = () => saveGoals(store.get(), goals.filter((_, j) => j !== g.i)).catch(() => { $('goalErr').textContent = 'Could not save.'; });
      li.append(b);
    }
    list.append(li);
  }
  $('addGoal').hidden = !canEdit;
  $('goals').hidden = !goals.length && !canEdit;
}

$('addGoal').addEventListener('submit', async e => {
  e.preventDefault();
  const t = $('goalText').value.trim(), d = $('goalDate').value;
  if (!t) return;
  $('goalErr').textContent = 'Saving…';
  try {
    await saveGoals(store.get(), [...goals, d ? { t, d } : { t }]);
    $('goalText').value = ''; $('goalDate').value = ''; $('goalErr').textContent = '';
  } catch { $('goalErr').textContent = 'Could not save.'; }
});

function showLock(msg) { $('lockWrap').hidden = false; $('view').hidden = true; $('next').hidden = true; $('err').textContent = msg || ''; $('pw').focus(); }

$('lock').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = 'Opening…';
  try { await start($('pw').value); }
  catch (err) { showLock(err.message === 'fetch' ? 'Could not load the schedule.' : 'Wrong password.'); }
});

const saved = store.get();
if (saved) start(saved).catch(err => showLock(err.message === 'fetch' ? 'Could not load the schedule.' : ''));
else showLock();
</script>
</body>
</html>
