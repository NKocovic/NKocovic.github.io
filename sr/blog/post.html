<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="blog-base" content="../../blog/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nikola Kočović">
  <meta property="og:title" content="Blog — Nikola Kočović">

  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <script>
    document.documentElement.classList.add('js');
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.remove('js'); }, 2500);
    // Page transitions: slide forward into the blog, back out of it, cross-fade between languages.
    addEventListener('pagereveal', function (e) {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(function () {}); // a skipped transition (e.g. a quick second click) is fine
      document.documentElement.classList.add('no-intro');
      try {
        var depth = function (u) { var p = new URL(u).pathname; return /\/blog\/post\.html$/.test(p) ? 2 : /\/blog\//.test(p) ? 1 : 0; };
        var from = navigation.activation.from;
        if (from) {
          var d = depth(location.href) - depth(from.url);
          e.viewTransition.types.add(d > 0 ? 'forward' : d < 0 ? 'back' : 'swap');
        }
      } catch (err) {}
    });
    addEventListener('pageswap', function (e) {
      if (e.viewTransition) e.viewTransition.ready.catch(function () {});
    });
  </script>
  <script src="../../site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="../../blog/blog.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <nav class="top-nav" aria-label="Sajt">
        <a class="nav-blog" href="./">Blog</a>
        <span class="lang">
          <a href="../../blog/post.html" data-keep-query hreflang="en" lang="en">EN</a>
          <span aria-current="true">SR</span>
        </span>
      </nav>
      <a class="home-link" href="../">Nikola Kočović</a>
      <p class="post-meta"><a href="./">← Sve objave</a><time id="post-date"></time></p>
      <h1 class="post-title" id="post-title">&nbsp;</h1>
    </header>

    <article class="post" id="post-body"></article>

    <footer class="footer">
      <span>&copy; 2026 Nikola Kočović</span>
    </footer>
  </main>
</body>
</html>
